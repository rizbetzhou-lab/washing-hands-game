<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>泡泡洗手小游戏</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#32465a}
*{box-sizing:border-box}body{margin:0;background:#eaf8ff;min-height:100vh;display:grid;place-items:center;padding:18px}
.game{width:min(100%,700px);background:white;border-radius:26px;padding:20px;box-shadow:0 12px 35px #5f9bb223;text-align:center}
h1{font-size:clamp(23px,5vw,32px);margin:4px 0 6px}p{margin:5px 0 15px;color:#65788a;font-size:15px}
.stage{position:relative;max-width:600px;margin:auto;border:3px solid #d6f0ff;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 52% 45%,#f9fdff,#dff4fd);aspect-ratio:600/450;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.stage svg.hand{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#dirt,#bubbles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.soap{position:absolute;left:12%;top:70%;width:68px;height:52px;border-radius:19px 23px 20px 25px;background:linear-gradient(140deg,#fff2ae,#f5ba64 75%);box-shadow:inset -8px -8px 12px #d88d4480,inset 5px 6px 9px #fffce4,0 7px 10px #7c96a05c;border:2px solid #edb36c;display:grid;place-items:center;font-weight:800;color:#ad6932;font-size:13px;pointer-events:none;transform:translate(-50%,-50%) rotate(-13deg);z-index:5}
.soap:after{content:"✦";position:absolute;top:5px;right:10px;color:#fff6d8}.soap.active{filter:brightness(1.06);transform:translate(-50%,-50%) rotate(10deg)}
.instruction{position:absolute;top:12px;left:50%;transform:translateX(-50%);border-radius:100px;background:#ffffffd9;padding:6px 15px;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none}
.progress-wrap{margin:17px auto 9px;max-width:560px;display:flex;gap:12px;align-items:center;font-weight:700;font-size:14px}.bar{flex:1;height:16px;border-radius:20px;background:#e4edf2;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#70caec,#49d5b3);transition:width .12s;border-radius:20px}#pct{width:42px;text-align:right;font-variant-numeric:tabular-nums}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}button{border:none;background:#258dbb;color:white;font-size:15px;border-radius:13px;padding:11px 19px;min-height:44px;font-weight:700;cursor:pointer}button.secondary{background:#e4f4fb;color:#2279a0}button:focus-visible{outline:3px solid #ffb94f;outline-offset:3px}
#message{min-height:25px;font-weight:700;color:#1b907c;margin-top:10px}
@media(max-width:430px){.game{padding:12px}.soap{width:55px;height:43px;font-size:11px}.instruction{font-size:11px;padding:5px 9px}.stage{border-radius:17px}}
</style>
</head>
<body>
<main class="game">
  <h1>🧼 泡泡洗手小能手</h1>
  <p>把肥皂放到脏脏的小手上，来回擦一擦！</p>
  <div class="stage" id="stage" aria-label="互动洗手游戏区域：用鼠标或手指在手上擦洗">
    <svg class="hand" viewBox="0 0 600 450" role="img" aria-label="摊开的手掌">
      <defs><linearGradient id="skin" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffd9ae"/><stop offset=".58" stop-color="#f5b987"/><stop offset="1" stop-color="#e99e70"/></linearGradient><filter id="shadow"><feGaussianBlur stdDeviation="10"/></filter></defs>
      <ellipse cx="308" cy="275" rx="154" ry="145" fill="#9ba9aa" opacity=".2" filter="url(#shadow)"/>
      <path id="handShape" d="M238 431 L224 356 C216 327 199 302 177 279 L106 207 C88 189 92 169 106 162 C122 153 138 163 153 175 L220 227 L204 86 C201 62 217 53 231 57 C245 59 251 73 253 90 L265 194 L266 46 C266 21 280 12 295 16 C310 20 316 32 315 52 L316 192 L339 63 C342 41 357 32 372 39 C385 45 386 60 382 79 L365 205 L398 121 C407 101 422 96 435 104 C447 112 448 127 440 146 L412 240 C399 284 397 318 390 351 L380 431 Z" fill="url(#skin)" stroke="#d99467" stroke-width="5" stroke-linejoin="round"/>
      <path d="M254 246 Q295 226 334 244 M264 283 Q310 268 359 288 M228 321 Q279 340 329 323" fill="none" stroke="#d99872" stroke-width="3" opacity=".5" stroke-linecap="round"/>
      <path d="M229 79 L238 142 M293 34 L292 133 M366 62 L353 146 M424 131 L399 190" stroke="#ffedcb" stroke-width="4" opacity=".5" stroke-linecap="round"/>
    </svg>
    <canvas id="dirt" width="600" height="450"></canvas>
    <canvas id="bubbles" width="600" height="450"></canvas>
    <div class="soap" id="soap" aria-hidden="true">SOAP</div>
    <div class="instruction" id="hint">👆 按住肥皂，在手上来回擦</div>
  </div>
  <div class="progress-wrap"><span>清洁进度</span><div class="bar" role="progressbar" aria-label="清洁进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><div class="fill" id="fill"></div></div><span id="pct">0%</span></div>
  <div class="controls"><button type="button" id="scrub">✨ 自动擦洗一下</button><button type="button" class="secondary" id="reset">↻ 重新开始</button></div>
  <div id="message" role="status" aria-live="polite">小手脏脏的，快来洗一洗吧！</div>
</main>
<script>
(()=>{
const root=document.querySelector('.game');if(root.dataset.started)return;root.dataset.started='1';
const stage=root.querySelector('#stage'),dirt=root.querySelector('#dirt'),bubbleCanvas=root.querySelector('#bubbles'),soap=root.querySelector('#soap'),fill=root.querySelector('#fill'),pct=root.querySelector('#pct'),bar=root.querySelector('#bar'),hint=root.querySelector('#hint'),message=root.querySelector('#message');
const d=dirt.getContext('2d'),b=bubbleCanvas.getContext('2d');const W=600,H=450;
const handPath=new Path2D('M238 431 L224 356 C216 327 199 302 177 279 L106 207 C88 189 92 169 106 162 C122 153 138 163 153 175 L220 227 L204 86 C201 62 217 53 231 57 C245 59 251 73 253 90 L265 194 L266 46 C266 21 280 12 295 16 C310 20 316 32 315 52 L316 192 L339 63 C342 41 357 32 372 39 C385 45 386 60 382 79 L365 205 L398 121 C407 101 422 96 435 104 C447 112 448 127 440 146 L412 240 C399 284 397 318 390 351 L380 431 Z');
let dirty=new Uint8Array(W*H),total=0,remaining=0,drag=false,won=false,bubbles=[],raf=0,last={x:75,y:330},pointerId=null;
const rand=(a,b)=>a+Math.random()*(b-a);
function seed(){d.clearRect(0,0,W,H);d.save();d.clip(handPath);for(let i=0;i<100;i++){let x=rand(116,426),y=rand(80,425),r=rand(9,37);let grad=d.createRadialGradient(x,y,1,x,y,r);grad.addColorStop(0,'rgba(112,77,47,.52)');grad.addColorStop(.6,'rgba(130,87,47,.34)');grad.addColorStop(1,'rgba(146,106,66,0)');d.fillStyle=grad;d.beginPath();d.arc(x,y,r,0,Math.PI*2);d.fill()}for(let i=0;i<240;i++){d.beginPath();d.fillStyle=`rgba(86,68,44,${rand(.15,.38)})`;d.arc(rand(110,434),rand(58,431),rand(1,4),0,7);d.fill()}d.restore();const data=d.getImageData(0,0,W,H).data;dirty.fill(0);total=0;for(let y=0;y<H;y+=3)for(let x=0;x<W;x+=3){let i=y*W+x;if(data[i*4+3]>24){dirty[i]=1;total++}}remaining=total;}
function reset(){won=false;drag=false;bubbles=[];b.clearRect(0,0,W,H);seed();last={x:75,y:330};moveSoap(last.x,last.y);hint.textContent='👆 按住肥皂，在手上来回擦';message.textContent='小手脏脏的，快来洗一洗吧！';progress();}
function progress(){let value=total?Math.min(100,Math.round(100*(total-remaining)/total)):0;fill.style.width=value+'%';pct.textContent=value+'%';bar.setAttribute('aria-valuenow',value);if(value>=94&&!won){won=true;d.clearRect(0,0,W,H);remaining=0;fill.style.width='100%';pct.textContent='100%';bar.setAttribute('aria-valuenow','100');hint.textContent='🌟 洗手成功！';message.textContent='🎉 太棒啦！小手洗得干干净净！';spawn(300,220,45)}}
function moveSoap(x,y){soap.style.left=x/W*100+'%';soap.style.top=y/H*100+'%'}
function spawn(x,y,count=4){for(let i=0;i<count;i++){if(bubbles.length>180)bubbles.shift();bubbles.push({x:x+rand(-26,26),y:y+rand(-18,18),r:rand(4,13),vx:rand(-.7,.7),vy:rand(-2.4,-.7),life:rand(26,65),max:65})}if(!raf)raf=requestAnimationFrame(animate)}
function animate(){raf=0;b.clearRect(0,0,W,H);bubbles=bubbles.filter(o=>o.life>0);for(let o of bubbles){o.x+=o.vx;o.y+=o.vy;o.life--;b.globalAlpha=Math.min(1,o.life/20);b.beginPath();b.arc(o.x,o.y,o.r,0,Math.PI*2);b.fillStyle='rgba(220,252,255,.46)';b.fill();b.strokeStyle='#87d9ed';b.lineWidth=1.5;b.stroke();b.beginPath();b.arc(o.x-o.r*.29,o.y-o.r*.35,Math.max(1,o.r*.2),0,Math.PI*2);b.fillStyle='white';b.fill()}b.globalAlpha=1;if(bubbles.length)raf=requestAnimationFrame(animate)}
function scrubAt(x,y){if(won)return;d.save();d.globalCompositeOperation='destination-out';let g=d.createRadialGradient(x,y,6,x,y,33);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.68,'rgba(0,0,0,.95)');g.addColorStop(1,'rgba(0,0,0,0)');d.fillStyle=g;d.beginPath();d.arc(x,y,33,0,Math.PI*2);d.fill();d.restore();let r=29;for(let yy=Math.max(0,Math.floor(y-r));yy<Math.min(H,Math.ceil(y+r));yy+=3)for(let xx=Math.max(0,Math.floor(x-r));xx<Math.min(W,Math.ceil(x+r));xx+=3){if((xx-x)**2+(yy-y)**2<r*r){let i=yy*W+xx;if(dirty[i]){dirty[i]=0;remaining--}}}spawn(x,y);progress()}
function fromEvent(e){let rect=stage.getBoundingClientRect();return{x:Math.max(0,Math.min(W,(e.clientX-rect.left)/rect.width*W)),y:Math.max(0,Math.min(H,(e.clientY-rect.top)/rect.height*H))}}
function trace(a,c){let steps=Math.max(1,Math.ceil(Math.hypot(c.x-a.x,c.y-a.y)/8));for(let i=1;i<=steps;i++){let t=i/steps;scrubAt(a.x+(c.x-a.x)*t,a.y+(c.y-a.y)*t)}}
stage.addEventListener('pointerdown',e=>{if(won)return;const p=fromEvent(e);if(Math.hypot(p.x-last.x,p.y-last.y)>95){last=p;moveSoap(p.x,p.y)}drag=true;pointerId=e.pointerId;stage.setPointerCapture(e.pointerId);soap.classList.add('active');trace(last,p);last=p;hint.textContent='🫧 擦一擦，泡泡冒出来！';e.preventDefault()});
stage.addEventListener('pointermove',e=>{if(!drag||pointerId!==e.pointerId)return;let p=fromEvent(e);trace(last,p);last=p;moveSoap(p.x,p.y);e.preventDefault()});
const stop=e=>{if(pointerId!==e.pointerId)return;drag=false;pointerId=null;soap.classList.remove('active')};stage.addEventListener('pointerup',stop);stage.addEventListener('pointercancel',stop);
root.querySelector('#reset').addEventListener('click',reset);
root.querySelector('#scrub').addEventListener('click',()=>{if(won)return;for(let i=0;i<38;i++){let x=rand(204,379),y=rand(180,380);scrubAt(x,y)}message.textContent=won?'🎉 太棒啦！小手洗得干干净净！':'泡泡越来越多了！继续擦擦小手吧！'});
reset();
})();
</script>
</body>
</html>
